name = "helder-imoveis"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ─── Banco de dados D1 ───────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "helder-freire-imoveis"
database_id = "aaf4b7fd-dc95-49a8-bd1e-1f2ffe29c9d8"

# ─── R2 — Armazenamento de imagens ───────────────────────────────
# As imagens ficam no bucket PRIVADO e são servidas via /api/foto/*
# Não é necessária URL pública do bucket.
#
# Para criar o bucket (apenas uma vez):
#   wrangler r2 bucket create helder-fotos
# Ou: Cloudflare Dashboard → R2 → Create bucket → nome: helder-fotos
[[r2_buckets]]
binding = "FOTOS_BUCKET"
bucket_name = "helder-fotos"

# ─── Variáveis de ambiente ───────────────────────────────────────
[vars]
ADMIN_USER = "admin"
# ADMIN_PASS → definir com: wrangler secret put ADMIN_PASS
# JWT_SECRET → definir com: wrangler secret put JWT_SECRET
